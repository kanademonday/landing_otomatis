name: Perbarui data Samarinda (OSM)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 1 * *'   # tiap tanggal 2, pukul 02:17 WITA
  push:
    branches: [main]
    paths:
      - 'tools/fetch_samarinda.py'
      - '.github/workflows/data-samarinda.yml'

permissions:
  contents: write

concurrency:
  group: data-samarinda
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unduh & proses data OpenStreetMap
        run: python tools/fetch_samarinda.py
      - name: Simpan ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Tidak ada perubahan data"; exit 0; fi
          git commit -m "Data: perbarui jalan & batas wilayah Samarinda dari OpenStreetMap"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
